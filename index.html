<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: yellow;
            transition: 2s;
        }
        .bgcolor--gray {
            background-color: GRAY;
        }
        .bgcolor--red {
            background-color: PINK;
        }
        .bgcolor--yellow {
            background-color: yellow;
        }
    </style>
</head>
<body>
    자바스크립트연습
    <button class="bgcolor">배경색상 변경 그레이</button>
    <button class="btn--red">배경색상 변경 핑크</button>
    <button class="btn--reset">배경색상 초기화</button>
    <button class="btn--yellow">배경색상 노랑색</button>

    <script>
        const btnBgcolor = document.querySelector('.bgcolor')
        btnBgcolor.addEventListener('click', function(){
            document.body.classList.toggle('bgcolor--gray');
        })

        const btnRed = document.querySelector('.btn--red')
        btnRed.addEventListener('click', function(){
            document.body.classList.toggle('bgcolor--red');
        })

        document.querySelector('.btn--reset').addEventListener('click', function () {
            document.body.classList.remove('bgcolor--gray', 'bgcolor--red', 'bgcolor--yellow')
        })

        document.querySelector('.btn--yellow').addEventListener('click', function () {
            document.body.classList.add('bgcolor--yellow')
        })

        // 주석처리 : 설명글 입력하기 위해 사용
    </script>
</body>
</html>
